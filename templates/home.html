

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Performance Predictor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            color: white;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        label {
            font-size: 14px;
            margin-bottom: 5px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        select, input {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        option {
            color: black;
        }

        .btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: #ff7eb3;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ff4e8a;
            transform: scale(1.05);
        }

        .result-box {
            margin-top: 20px;
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            background: rgba(0,0,0,0.3);
            font-size: 18px;
        }

        .highlight {
            font-size: 28px;
            font-weight: bold;
            color: #00ffcc;
        }

    </style>
</head>
<body>

<div class="container">
    <h1> Student Performance Predictor</h1>

    <form action="{{ url_for('predict_datapoint')}}" method="post">
        <div class="form-grid">

            <div>
                <label>Gender</label>
                <select name="gender" required>
                    <option disabled selected>Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div>
                <label>Race / Ethnicity</label>
                <select name="ethnicity" required>
                    <option disabled selected>Select</option>
                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>

            <div>
                <label>Parental Education</label>
                <select name="parental_level_of_education" required>
                    <option disabled selected>Select</option>
                    <option value="associate's degree">Associate's</option>
                    <option value="bachelor's degree">Bachelor's</option>
                    <option value="high school">High School</option>
                    <option value="master's degree">Master's</option>
                    <option value="some college">Some College</option>
                    <option value="some high school">Some High School</option>
                </select>
            </div>

            <div>
                <label>Lunch Type</label>
                <select name="lunch" required>
                    <option disabled selected>Select</option>
                    <option value="free/reduced">Free/Reduced</option>
                    <option value="standard">Standard</option>
                </select>
            </div>

            <div>
                <label>Test Preparation</label>
                <select name="test_preparation_course" required>
                    <option disabled selected>Select</option>
                    <option value="none">None</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div>
                <label>Reading Score</label>
                <input type="number" name="reading_score" min="0" max="100" required>
            </div>

            <div>
                <label>Writing Score</label>
                <input type="number" name="writing_score" min="0" max="100" required>
            </div>

        </div>

        <button class="btn"> Predict Maths Score</button>
    </form>

    {% if results %}
    <div class="result-box">
        Predicted Maths Score:
        <div class="highlight">{{ results }}</div>
    </div>
    {% endif %}

</div>

</body>
</html>
